<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>Torrijos Golf</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7faf8;
        color: #1d5c52;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(29, 92, 82, 0.2);
        border-top-color: #1d5c52;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Placeholder local del shell nativo: Capacitor carga la web desplegada
      (server.url en capacitor.config.ts). Esto solo se ve un instante si no
      hay conexión al arrancar.
    -->
    <div class="wrap">
      <div class="spinner"></div>
      <div>Torrijos Golf</div>
    </div>
  </body>
</html>
